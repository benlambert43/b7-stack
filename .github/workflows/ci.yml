name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold and check a project (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: web only
            desktop: "no"
          - variant: with the desktop app
            desktop: "yes"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json
      - name: Install and preflight the root
        run: npm ci && npm run preflight
      - name: Generate a project the way npx does
        env:
          PACKAGE: github:${{ github.repository }}#${{ github.event.pull_request.head.sha || github.sha }}
        run: printf '%s\n' "Demo App" "A project generated in CI." "" "${{ matrix.desktop }}" | npx --yes "$PACKAGE"
      - name: Check that no placeholder survived
        run: "! grep -rIiE 'b7[-_ ]?stack' demo-app --exclude-dir=node_modules --exclude-dir=.git"
      - name: Check that no template marker survived
        run: "! grep -rIE '(desktop|web-only):(start|end)' demo-app --exclude-dir=node_modules --exclude-dir=.git"
      - name: Check that nothing of the desktop app was copied
        if: ${{ matrix.desktop == 'no' }}
        run: "! grep -rIi 'desktop' demo-app --exclude-dir=node_modules --exclude-dir=.git"
      - name: Preflight the project
        run: npm run preflight
        working-directory: demo-app
