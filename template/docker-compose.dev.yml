services:
  database:
    container_name: b7-stack-database
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.template to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.template to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.template to .env and set POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host localhost --username $$POSTGRES_USER --dbname $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - b7-stack-database:/var/lib/postgresql

volumes:
  b7-stack-database:
